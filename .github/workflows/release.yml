# Publica uma nova versão no GitHub Releases quando você cria uma tag "vX.Y.Z".
# Gera os instaladores (Windows, macOS, Linux), assina e cria o latest.json que o app consulta.
name: Publicar versão

on:
  push:
    tags: ["v*"]

jobs:
  publicar:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows-latest
            args: ""
          - plataforma: ubuntu-22.04
            args: ""
          - plataforma: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Horários Escolares ${{ github.ref_name }}"
          releaseBody: "Veja as novidades desta versão e atualize pelo próprio aplicativo."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
